version: '3.9'

services:
  postgres:
    container_name: postgress
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}  
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nestjs-network     

volumes:
  postgres-data:

networks:
  nestjs-network: