services:
  postgres:
    container_name: postgress
    image: postgres:18
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=nest_project
    ports:
      - '5433:5432'
    volumes:
      - postgres18-data:/var/lib/postgresql
    networks:
      - nestjs-network

volumes:
  postgres-data:
  postgres18-data:

networks:
  nestjs-network:
